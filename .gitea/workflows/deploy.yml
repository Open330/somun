name: Build and Deploy

# GitHub(Open330/somun)이 origin, Gitea는 빌드용 미러. 이미지는 registry.jiun.dev/somun:<sha>,
# 배포는 IaC 레포의 overlay newTag 커밋으로만 (prod는 ArgoCD 수동 sync).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "drizzle/**"
      - "seeds/**"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".gitea/workflows/**"

env:
  REGISTRY: registry.jiun.dev
  IMAGE_NAME: somun
  IAC_REPO: jiunbae/IaC
  PROD_PATH: kubernetes/overlays/prod/somun

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify source
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # prod는 arm64(OrbStack), dev는 amd64. 둘 다 빌드한다. :latest는 밀지 않는다.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ gitea.sha }}
          # 웹 로그인은 jiun-api OAuth. 빌드 시점에 번들에 박힌다.
          build-args: |
            VITE_AUTH_URL=https://api.jiun.dev
            VITE_AUTH_AUDIENCE=somun
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Bump prod image tag in IaC
        run: |
          git clone https://x-access-token:${{ secrets.IAC_GITHUB_TOKEN }}@github.com/${{ env.IAC_REPO }}.git iac
          cd iac
          sed -i "s/newTag: .*/newTag: ${{ gitea.sha }}/" ${{ env.PROD_PATH }}/kustomization.yaml
          git config user.name "CI Bot"
          git config user.email "ci@jiun.dev"
          git add ${{ env.PROD_PATH }}/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore(somun): update prod image to ${{ gitea.sha }}"
          git push
