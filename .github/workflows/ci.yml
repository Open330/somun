name: CI

# PR마다 머지 전에 같은 검사를 돌린다. 이미지 빌드·배포는 Gitea 미러(.gitea/workflows/deploy.yml)가 main에서 한다.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PR은 새 푸시가 이전 실행을 대신한다. main은 커밋마다 끝까지 검사한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
