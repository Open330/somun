<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    소문 = ㅅ(말)이 ㅁ(만든 것) 위로 걸쳐 들어온다. 읽는 순서대로 ㅅ이 왼쪽, ㅁ이 오른쪽.
    격자 1024. 획 128. ㅁ 512×512, 모서리 120. ㅁ 안쪽의 ㅅ은 종이색으로 반전.
    ㅅ의 오른획은 한글 구조대로 왼획 중간에서 갈라진다.
  -->
  <defs><clipPath id="box"><rect x="352" y="352" width="512" height="512" rx="120"/></clipPath></defs>
  <rect x="352" y="352" width="512" height="512" rx="120" fill="#0F6F5C"/>
  <g fill="none" stroke="#0F6F5C" stroke-width="128" stroke-linecap="round" stroke-linejoin="round"><path d="M420 208 L154 720"/><path d="M348 346 L656 720"/></g>
  <g clip-path="url(#box)" fill="none" stroke="#F4F6F8" stroke-width="128" stroke-linecap="round" stroke-linejoin="round"><path d="M420 208 L154 720"/><path d="M348 346 L656 720"/></g>
</svg>
