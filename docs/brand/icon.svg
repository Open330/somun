<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="stroke" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2fc39c"/>
      <stop offset="0.55" stop-color="#128a72"/>
      <stop offset="1" stop-color="#0a4f42"/>
    </linearGradient>
    <linearGradient id="ripple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0c4"/>
      <stop offset="1" stop-color="#128a72"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#0a4f42" flood-opacity="0.32"/>
    </filter>
    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <!-- 광택과 그늘을 S 몸통 안에만 -->
    <mask id="body">
      <path d="M676 350 A164 164 0 1 0 512 512 A164 164 0 1 1 348 674" fill="none" stroke="#fff" stroke-width="128" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- 파문: S의 두 끝에서 바깥으로 번진다 -->
  <g fill="none" stroke="url(#ripple)" stroke-linecap="round">
    <path d="M722 246 a 226 226 0 0 0 -214 -130" stroke-width="22" opacity="0.55"/>
    <path d="M776 214 a 300 300 0 0 0 -262 -170" stroke-width="16" opacity="0.32"/>
    <path d="M302 778 a 226 226 0 0 0 214 130" stroke-width="22" opacity="0.55"/>
    <path d="M248 810 a 300 300 0 0 0 262 170" stroke-width="16" opacity="0.32"/>
  </g>

  <!-- S 본체 -->
  <g filter="url(#shadow)">
    <path d="M676 350 A164 164 0 1 0 512 512 A164 164 0 1 1 348 674" fill="none" stroke="url(#stroke)" stroke-width="128" stroke-linecap="round"/>
  </g>
  <g mask="url(#body)">
    <!-- 상단 광택: 같은 경로를 가늘게, 위로 살짝 올려 -->
    <path d="M676 350 A164 164 0 1 0 512 512 A164 164 0 1 1 348 674" fill="none" stroke="url(#sheen)" stroke-width="56" stroke-linecap="round" transform="translate(0,-34)" opacity="0.85"/>
    <!-- 하단 깊이: 아래쪽 가장자리를 어둡게 -->
    <path d="M676 350 A164 164 0 1 0 512 512 A164 164 0 1 1 348 674" fill="none" stroke="#06352c" stroke-width="34" stroke-linecap="round" transform="translate(0,56)" opacity="0.30" filter="url(#inner)"/>
  </g>
</svg>
